name: build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RealTimeTranslater.sln

      - name: Build
        run: dotnet build RealTimeTranslater.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/RealTimeTranslater.Core.Tests/RealTimeTranslater.Core.Tests.csproj -c Release --no-build
